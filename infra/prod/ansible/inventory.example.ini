# Copy to inventory.ini (gitignored) and set the real host. On a fresh box the
# first run connects as root, where the provider installs your key; later runs
# work the same way, since the hardening leaves key-only root login in place.
# Moving to a new server is: point this at the new address and run again.
[doelab]
doelab.example.com ansible_user=root
