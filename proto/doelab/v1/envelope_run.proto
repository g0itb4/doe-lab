syntax = "proto3";

package doelab.v1;

import "buf/validate/validate.proto";
import "doelab/v1/common.proto";
import "google/protobuf/timestamp.proto";

// EnvelopeRunService records the runs of the engine. The engine creates a run
// before it publishes, and completes it when it is done; everyone else reads.
service EnvelopeRunService {
  rpc GetEnvelopeRun(GetEnvelopeRunRequest) returns (GetEnvelopeRunResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The runs of a feeder, newest first.
  rpc ListEnvelopeRuns(ListEnvelopeRunsRequest) returns (ListEnvelopeRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Starts a run. Idempotent on idempotency_key: creating a run again with
  // the same key returns the first run. Needs the engine scope.
  rpc CreateEnvelopeRun(CreateEnvelopeRunRequest) returns (CreateEnvelopeRunResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Finishes a run, as completed or as failed. Needs the engine scope.
  rpc CompleteEnvelopeRun(CompleteEnvelopeRunRequest) returns (CompleteEnvelopeRunResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Records the forecast state of the feeder for each interval of a run: what
  // the envelopes were computed against. Once per run. Needs the engine
  // scope.
  rpc CreateEnvelopeRunIntervals(CreateEnvelopeRunIntervalsRequest) returns (CreateEnvelopeRunIntervalsResponse);
  // Records what a run solved bus by bus and line by line, for whole
  // intervals: the states of each interval named replace everything stored
  // for it, by this run or an earlier one. The engine sends a run's intervals
  // a few at a time. Needs the engine scope.
  rpc RecordFeederStates(RecordFeederStatesRequest) returns (RecordFeederStatesResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // The intervals of a run, in time order.
  rpc ListEnvelopeRunIntervals(ListEnvelopeRunIntervalsRequest) returns (ListEnvelopeRunIntervalsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Writes the envelopes that a completed run published to the object store,
  // as CSV, and returns a link to the file that works for a short time.
  // Exporting a run again replaces the file with the same rows. Needs the
  // operator scope.
  rpc ExportEnvelopeRun(ExportEnvelopeRunRequest) returns (ExportEnvelopeRunResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// One run of the engine. Mirrors the envelope_runs table.
message EnvelopeRun {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string feeder_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // The config version the run used.
  string envelope_config_id = 3 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  RunStatus status = 4 [(buf.validate.field).enum.defined_only = true];
  // Chosen by the engine: 8 to 128 characters of A-Z a-z 0-9 . _ : -
  string idempotency_key = 5 [
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:-]{8,128}$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Start of the first interval of the run, in feeder time.
  google.protobuf.Timestamp horizon_from = 6;
  // End of the last interval of the run, in feeder time.
  google.protobuf.Timestamp horizon_to = 7;
  // Wall-clock time the run was created.
  google.protobuf.Timestamp started_at = 8;
  // Wall-clock time the run finished. Unset while it is running.
  optional google.protobuf.Timestamp completed_at = 9;
  // How long the engine took. Unset while the run is running.
  optional int32 duration_ms = 10 [(buf.validate.field).int32.gte = 0];
  int32 site_count = 11 [(buf.validate.field).int32.gte = 0];
  int32 interval_count = 12 [(buf.validate.field).int32.gte = 0];
  // Envelopes published by the run so far.
  int32 envelope_count = 13 [(buf.validate.field).int32.gte = 0];
  string engine_version = 14 [(buf.validate.field).string.max_len = 100];
  // Why the run failed. Set exactly when status is FAILED.
  optional string error = 15 [(buf.validate.field).string.max_len = 2000];
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

message GetEnvelopeRunRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetEnvelopeRunResponse {
  EnvelopeRun envelope_run = 1;
}

message ListEnvelopeRunsRequest {
  string feeder_id = 1 [(buf.validate.field).string.uuid = true];
  // Only runs in this state.
  optional RunStatus status = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];
  string page_token = 4 [(buf.validate.field).string.max_len = 1024];
}

message ListEnvelopeRunsResponse {
  repeated EnvelopeRun envelope_runs = 1;
  string next_page_token = 2;
}

message CreateEnvelopeRunRequest {
  // Set by the client: feeder_id, envelope_config_id, idempotency_key,
  // horizon_from, horizon_to, engine_version. The rest is the server's.
  EnvelopeRun envelope_run = 1 [(buf.validate.field).required = true];

  option (buf.validate.message).cel = {
    id: "create_envelope_run.required"
    message: "feeder_id, envelope_config_id, idempotency_key, horizon_from, horizon_to and engine_version are required"
    expression: "this.envelope_run.feeder_id != '' && this.envelope_run.envelope_config_id != '' && this.envelope_run.idempotency_key != '' && has(this.envelope_run.horizon_from) && has(this.envelope_run.horizon_to) && this.envelope_run.engine_version != ''"
  };
  option (buf.validate.message).cel = {
    id: "create_envelope_run.horizon"
    message: "horizon_to must be after horizon_from"
    expression: "!has(this.envelope_run.horizon_from) || !has(this.envelope_run.horizon_to) || this.envelope_run.horizon_to > this.envelope_run.horizon_from"
  };
  option (buf.validate.message).cel = {
    id: "create_envelope_run.server_set"
    message: "id and status are set by the server"
    expression: "this.envelope_run.id == '' && this.envelope_run.status == 0"
  };
}

message CreateEnvelopeRunResponse {
  EnvelopeRun envelope_run = 1;
}

message CompleteEnvelopeRunRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  // COMPLETED or FAILED.
  RunStatus status = 2 [(buf.validate.field).enum = {
    in: [
      2,
      3
    ]
  }];
  int32 duration_ms = 3 [(buf.validate.field).int32.gte = 0];
  int32 site_count = 4 [(buf.validate.field).int32.gte = 0];
  int32 interval_count = 5 [(buf.validate.field).int32.gte = 0];
  // Required exactly when status is FAILED.
  optional string error = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2000
  }];

  option (buf.validate.message).cel = {
    id: "complete_envelope_run.error"
    message: "error must be set exactly when status is FAILED"
    expression: "(this.status == 3) == has(this.error)"
  };
}

message CompleteEnvelopeRunResponse {
  EnvelopeRun envelope_run = 1;
}

// The forecast state of the whole feeder for one interval of a run. Mirrors
// the envelope_run_intervals table.
message EnvelopeRunInterval {
  // Set by the server, from the request.
  string envelope_run_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Set by the server, from the run.
  string feeder_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  google.protobuf.Timestamp valid_from = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp valid_to = 4 [(buf.validate.field).required = true];
  // Forecast power through the transformer with every site at its forecast:
  // positive is supply to the feeder, negative is reverse flow.
  double forecast_net_load_w = 5;
  // Forecast transformer loading, as a percentage of its rating.
  double forecast_loading_pct = 6 [(buf.validate.field).double.gte = 0];
  // Lowest and highest customer voltage with every site at its forecast.
  double forecast_v_min_pu = 7 [(buf.validate.field).double.gt = 0];
  double forecast_v_max_pu = 8 [(buf.validate.field).double.gt = 0];
  // Sum of the limits the run gave for the interval.
  double export_limit_total_w = 9 [(buf.validate.field).double.gte = 0];
  double import_limit_total_w = 10 [(buf.validate.field).double.gte = 0];
  // What the enrolled sites could export under the config's fixed limit, the
  // highest voltage that would cause, and the limit it would break.
  double static_limit_total_w = 11 [(buf.validate.field).double.gte = 0];
  double static_v_max_pu = 12 [(buf.validate.field).double.gt = 0];
  BindingConstraint static_binding = 13 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string static_binding_element = 14 [(buf.validate.field).string.max_len = 200];
  google.protobuf.Timestamp created_at = 15;
  // Highest customer voltage if every enrolled site exported at its envelope:
  // the engine's check on its own answer. Unset for a row from before the
  // engine recorded it.
  optional double envelope_v_max_pu = 16 [(buf.validate.field).double.gt = 0];

  option (buf.validate.message).cel = {
    id: "envelope_run_interval.period"
    message: "valid_to must be after valid_from"
    expression: "this.valid_to > this.valid_from"
  };
  option (buf.validate.message).cel = {
    id: "envelope_run_interval.voltage"
    message: "forecast_v_min_pu must not be above forecast_v_max_pu"
    expression: "this.forecast_v_min_pu <= this.forecast_v_max_pu"
  };
}

// The voltage at a bus for one interval, as the latest run that covered the
// interval solved it. Mirrors the feeder_node_states table. Each list holds
// phases 1 to 3, phase to neutral, per unit of the nominal voltage.
message FeederNodeState {
  // Set by the server, from the run.
  string feeder_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string node_id = 2 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp valid_from = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp valid_to = 4 [(buf.validate.field).required = true];
  // Set by the server, from the request.
  string envelope_run_id = 5 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // With every site at its forecast.
  repeated double forecast_v_pu = 6 [(buf.validate.field).repeated = {
    min_items: 3
    max_items: 3
  }];
  // With every enrolled site exporting at its envelope.
  repeated double envelope_v_pu = 7 [(buf.validate.field).repeated = {
    min_items: 3
    max_items: 3
  }];
  // With every enrolled site exporting at the fixed limit.
  repeated double static_v_pu = 8 [(buf.validate.field).repeated = {
    min_items: 3
    max_items: 3
  }];

  option (buf.validate.message).cel = {
    id: "feeder_node_state.period"
    message: "valid_to must be after valid_from"
    expression: "this.valid_to > this.valid_from"
  };
}

// The flow in a line for one interval, as the latest run that covered the
// interval solved it. Mirrors the feeder_line_states table. Each list of
// currents holds phases 1 to 3 and then the neutral, in amperes.
message FeederLineState {
  // Set by the server, from the run.
  string feeder_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string line_id = 2 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp valid_from = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp valid_to = 4 [(buf.validate.field).required = true];
  // Set by the server, from the request.
  string envelope_run_id = 5 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  repeated double forecast_current_a = 6 [(buf.validate.field).repeated = {
    min_items: 4
    max_items: 4
  }];
  repeated double envelope_current_a = 7 [(buf.validate.field).repeated = {
    min_items: 4
    max_items: 4
  }];
  repeated double static_current_a = 8 [(buf.validate.field).repeated = {
    min_items: 4
    max_items: 4
  }];
  // Power the line carries towards its far end, in watts. Negative is power
  // flowing back towards the transformer.
  double forecast_power_w = 9;
  double envelope_power_w = 10;
  double static_power_w = 11;

  option (buf.validate.message).cel = {
    id: "feeder_line_state.period"
    message: "valid_to must be after valid_from"
    expression: "this.valid_to > this.valid_from"
  };
}

message RecordFeederStatesRequest {
  string envelope_run_id = 1 [(buf.validate.field).string.uuid = true];
  // Whole intervals: every node state of each interval named.
  repeated FeederNodeState nodes = 2 [(buf.validate.field).repeated.max_items = 8000];
  // Whole intervals: every line state of each interval named.
  repeated FeederLineState lines = 3 [(buf.validate.field).repeated.max_items = 8000];
}

message RecordFeederStatesResponse {
  int32 nodes = 1;
  int32 lines = 2;
}

message CreateEnvelopeRunIntervalsRequest {
  string envelope_run_id = 1 [(buf.validate.field).string.uuid = true];
  repeated EnvelopeRunInterval intervals = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 288
  }];
}

message CreateEnvelopeRunIntervalsResponse {
  int32 created = 1;
}

message ListEnvelopeRunIntervalsRequest {
  string envelope_run_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListEnvelopeRunIntervalsResponse {
  repeated EnvelopeRunInterval intervals = 1;
}

message ExportEnvelopeRunRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ExportEnvelopeRunResponse {
  // A presigned link to the CSV file. Anyone who has it can download the
  // file until expires_at.
  string url = 1;
  // Wall-clock time the link stops working.
  google.protobuf.Timestamp expires_at = 2;
  // Envelopes in the file: its lines, less the header.
  int32 rows = 3;
  // Where the file is in the object store.
  string object_key = 4;
}
