# gitleaks configuration. The default rules stay on; this file only adds
# allowlists, and each one says why it is safe.
title = "doe-lab"

[extend]
useDefault = true

[[allowlists]]
description = "Checksums of public datasets, not credentials"
paths = ['''^data/SHA256SUMS$''']

[[allowlists]]
description = "Lockfile integrity hashes"
paths = ['''(^|/)bun\.lock$''', '''(^|/)go\.sum$''', '''(^|/)buf\.lock$''']
