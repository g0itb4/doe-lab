    doelab.v1.PublishEnvelopesRequest:
      type: object
      properties:
        envelopeRunId:
          type: string
          title: envelope_run_id
          format: uuid
          description: The run the batch belongs to. It must be running.
        idempotencyKey:
          type: string
          title: idempotency_key
          pattern: ^[A-Za-z0-9._:-]{8,128}$
          description: 'Unique per batch: 8 to 128 characters of A-Z a-z 0-9 . _ : -'
        envelopes:
          type: array
          items:
            $ref: '#/components/schemas/doelab.v1.Envelope'
          title: envelopes
          maxItems: 5000
          minItems: 1
          description: |-
            Set by the client for each envelope: site_id, valid_from, valid_to, the
             two limits and the two bindings. The rest is the server's.
      title: PublishEnvelopesRequest
      additionalProperties: false
      description: |
        publish_envelopes.required // every envelope needs site_id, valid_from and valid_to, and must not set id, source, envelope_run_id or backstop_event_id
    doelab.v1.PublishEnvelopesResponse:
      type: object
      properties:
        published:
          type: integer
          title: published
          format: int32
          description: Envelopes written by this call. 0 when the batch was a replay.
        superseded:
          type: integer
          title: superseded
          format: int32
          description: Older envelopes that this call superseded.
        replayed:
          type: boolean
          title: replayed
          description: |-
            True when the key had been used with this same batch before, and
             nothing was written.
      title: PublishEnvelopesResponse
      additionalProperties: false
    doelab.v1.Reading:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
          format: uuid
        siteId:
          type: string
          title: site_id
          format: uuid
          description: Set by the server, from the device.
        ts:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ts
          description: Feeder time of the measurement.
        powerW:
          type: number
          title: power_w
          maximum: 1000000
          minimum: -1000000
          format: double
          description: |-
            The device's own power, in watts. Positive is towards the grid: PV
             generating, a battery discharging. An EV charging is negative.
        netExportW:
          type: number
          title: net_export_w
          maximum: 1000000
          minimum: -1000000
          format: double
          description: |-
            Net power at the site's connection point, in watts. Positive is export.
             This is what an export limit applies to.
        socPct:
          type:
            - number
            - "null"
          title: soc_pct
          maximum: 100
          minimum: 0
          format: double
          description: State of charge, for a battery or an EV.
        voltageV:
          exclusiveMinimum: 0
          type:
            - number
            - "null"
          title: voltage_v
          format: double
          description: Phase-to-neutral voltage at the device.
        receivedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: received_at
          description: 'Set by the server: wall-clock time the reading was stored.'
      title: Reading
      required:
        - ts
      additionalProperties: false
      description: One measurement from a device. Mirrors the readings table.
