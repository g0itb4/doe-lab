      title: RunStatus
      enum:
        - RUN_STATUS_UNSPECIFIED
        - RUN_STATUS_RUNNING
        - RUN_STATUS_COMPLETED
        - RUN_STATUS_FAILED
      description: The state of an engine run. Mirrors the run_status type.
    doelab.v1.Site:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        nmi:
          type: string
          title: nmi
          pattern: ^[A-Z0-9]{10}[0-9]$
          description: |-
            National Metering Identifier with its checksum digit: 11 characters. The
             checksum is verified by the service and by the schema.
        feederId:
          type: string
          title: feeder_id
          format: uuid
        nodeId:
          type: string
          title: node_id
          format: uuid
        name:
          type: string
          title: name
          maxLength: 200
          description: The connection's name in the source dataset.
        phase:
          type: integer
          title: phase
          maximum: 3
          minimum: 1
          format: int32
          description: 'The phase the site is connected to: 1, 2 or 3.'
        pvKw:
          type: number
          title: pv_kw
          minimum: 0
          format: double
          description: Installed PV capacity. 0 for a site with no PV.
        inverterKva:
          type: number
          title: inverter_kva
          minimum: 0
          format: double
        exportCapW:
          type: number
          title: export_cap_w
          minimum: 0
          format: double
          description: |-
            The largest export limit the site may be given. 0 means the site is
             passive: it gets no export envelope and is forecast instead.
        importCapW:
          type: number
          title: import_cap_w
          minimum: 0
          format: double
          description: |-
            The largest import limit the site may be given. 0 means no import
             envelope.
        hasBattery:
          type: boolean
          title: has_battery
        batteryKwh:
          exclusiveMinimum: 0
          type:
            - number
            - "null"
          title: battery_kwh
          format: double
          description: Set exactly when has_battery is true.
        hasEv:
          type: boolean
          title: has_ev
        profileCustomer:
          type:
            - integer
            - "null"
          title: profile_customer
          maximum: 300
          minimum: 1
          format: int32
          description: The Ausgrid Solar Home customer (1 to 300) whose data this site replays.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
        latitudeDeg:
          type:
            - number
            - "null"
          title: latitude_deg
          maximum: 90
          minimum: -90
          format: double
          description: |-
            Where the connection point is: WGS 84, in degrees, south and west
             negative. Set together, and unset for a site with no place on the map.
             Synthetic, like the NMI.
        longitudeDeg:
          type:
            - number
            - "null"
          title: longitude_deg
          maximum: 180
          minimum: -180
          format: double
      title: Site
      additionalProperties: false
      description: |
        A customer connection point: single phase, between one phase and the
         neutral of a bus. Mirrors the sites table. deleted_at is not on the wire: a
         deleted site is not returned.
        site.battery_sized // battery_kwh must be set exactly when has_battery is true
        site.location_complete // latitude_deg and longitude_deg must be set together
    doelab.v1.SiteForecastPoint:
      type: object
      properties:
        ts:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ts
        loadW:
          type: number
          title: load_w
          format: double
        pvW:
          type: number
          title: pv_w
          format: double
      title: SiteForecastPoint
      additionalProperties: false
      description: |-
        The forecast of a site for one half hour, with the config's PV scale
         applied.
    doelab.v1.SitePowerPoint:
      type: object
      properties:
        bucket:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: bucket
        avgNetExportW:
          type: number
          title: avg_net_export_w
          format: double
        maxNetExportW:
          type: number
          title: max_net_export_w
          format: double
        avgSocPct:
          type:
            - number
            - "null"
          title: avg_soc_pct
          format: double
        avgVoltageV:
          type:
            - number
            - "null"
          title: avg_voltage_v
          format: double
      title: SitePowerPoint
      additionalProperties: false
      description: One minute of a site's telemetry.
    doelab.v1.SiteProfile:
      type: object
      properties:
        siteId:
          type: string
          title: site_id
        ts:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ts
          description: Start of the half-hour interval, in the profile year.
        loadW:
          type: number
          title: load_w
          format: double
          description: Average general consumption over the interval.
        pvW:
          type: number
          title: pv_w
          format: double
          description: Average gross PV generation over the interval, before pv_scale.
        controlledLoadW:
          type: number
          title: controlled_load_w
          format: double
          description: Average controlled load (off-peak hot water) over the interval.
      title: SiteProfile
      additionalProperties: false
      description: One half-hour of a site's load and PV. Mirrors the site_profiles table.
    doelab.v1.SiteState:
      type: object
      properties:
        siteId:
          type: string
          title: site_id
        envelope:
          oneOf:
            - $ref: '#/components/schemas/doelab.v1.Envelope'
            - type: "null"
          title: envelope
          description: The envelope in force. Unset for a site that has none.
        reporting:
          type: boolean
          title: reporting
          description: A device of the site was heard within the offline period.
        netExportW:
          type:
            - number
            - "null"
          title: net_export_w
          format: double
          description: |-
            Net flow at the connection point as the site last reported it, in watts:
             positive is export. Unset for a site that is not reporting.
        overLimit:
          type: boolean
          title: over_limit
          description: The net flow is above the export limit in force.
        openAlert:
          oneOf:
            - $ref: '#/components/schemas/doelab.v1.Alert'
            - type: "null"
          title: open_alert
          description: The open alert of the site that matters most. Unset when it has none.
      title: SiteState
      additionalProperties: false
      description: |-
        One site at an instant: the envelope in force, and what its devices last
         said.
    doelab.v1.SubscribeEnvelopesRequest:
      type: object
      properties:
        nmi:
          type: string
          title: nmi
          pattern: ^[A-Z0-9]{10}[0-9]$
          description: |-
            The site whose envelope to follow. The caller's device token must be for
             this NMI.
      title: SubscribeEnvelopesRequest
      additionalProperties: false
    doelab.v1.SubscribeEnvelopesResponse:
      type: object
      properties:
        envelope:
          oneOf:
            - $ref: '#/components/schemas/doelab.v1.Envelope'
            - type: "null"
          title: envelope
          description: |-
            The envelope in force. Unset when the site has none: the device then
             falls back to its default limit.
        serverTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: server_time
          description: Feeder time at the server when the message was sent.
        keepalive:
          type: boolean
          title: keepalive
          description: |-
            True for a periodic message that repeats the envelope already sent. It
             keeps the stream alive and lets a device notice a dead connection.
      title: SubscribeEnvelopesResponse
      additionalProperties: false
    doelab.v1.Substation:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        code:
          type: string
          title: code
          pattern: ^[A-Z0-9][A-Z0-9_-]{0,31}$
          description: Short stable identifier, for example SUB-001.
        name:
          type: string
          title: name
          maxLength: 200
        dnsp:
          type: string
          title: dnsp
          maxLength: 200
          description: The distribution network service provider that owns the substation.
        state:
          type: string
          title: state
          pattern: ^[A-Z]{2,3}$
          description: 'The Australian state or territory, as its abbreviation: NSW, VIC, SA.'
        latitudeDeg:
          type: number
          title: latitude_deg
          maximum: 90
          minimum: -90
          format: double
          description: WGS 84, in degrees. South and west are negative.
        longitudeDeg:
          type: number
          title: longitude_deg
          maximum: 180
          minimum: -180
          format: double
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Substation
      additionalProperties: false
      description: |-
        A zone substation: the place that the feeders below it are drawn from. It
         is not part of the power flow. Mirrors the substations table.
    doelab.v1.UpdateDeviceRequest:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Device'
          title: device
        updateMask:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.FieldMask'
          title: update_mask
          description: 'Allowed path: rated_w.'
      title: UpdateDeviceRequest
      required:
        - device
        - updateMask
      additionalProperties: false
      description: |
        update_device.id // device.id is required
        update_device.mask // update_mask must be exactly: rated_w
        update_device.rated_w // rated_w must be positive
    doelab.v1.UpdateDeviceResponse:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Device'
          title: device
      title: UpdateDeviceResponse
      additionalProperties: false
    doelab.v1.UpdateFeederLineRequest:
      type: object
      properties:
        feederLine:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.FeederLine'
          title: feeder_line
        updateMask:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.FieldMask'
          title: update_mask
          description: 'Allowed path: ampacity_a.'
      title: UpdateFeederLineRequest
      required:
        - feederLine
        - updateMask
      additionalProperties: false
      description: |
        update_feeder_line.id // feeder_line.id is required
        update_feeder_line.mask // update_mask must be exactly: ampacity_a
    doelab.v1.UpdateFeederLineResponse:
      type: object
      properties:
        feederLine:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.FeederLine'
          title: feeder_line
      title: UpdateFeederLineResponse
      additionalProperties: false
    doelab.v1.UpdateFeederRequest:
      type: object
      properties:
        feeder:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Feeder'
          title: feeder
          description: feeder.id says which feeder; the fields named in update_mask are applied.
        updateMask:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.FieldMask'
          title: update_mask
          description: 'Allowed paths: name, tap_pu.'
      title: UpdateFeederRequest
      required:
        - feeder
        - updateMask
      additionalProperties: false
      description: |
        update_feeder.id // feeder.id is required
        update_feeder.mask // update_mask must name at least one of: name, tap_pu
        update_feeder.name // name must not be empty
        update_feeder.tap_pu // tap_pu must be between 0.85 and 1.15
    doelab.v1.UpdateFeederResponse:
      type: object
      properties:
        feeder:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Feeder'
          title: feeder
      title: UpdateFeederResponse
      additionalProperties: false
    doelab.v1.UpdateSiteRequest:
      type: object
      properties:
        site:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Site'
          title: site
        updateMask:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.FieldMask'
          title: update_mask
          description: |-
            Allowed paths: pv_kw, inverter_kva, export_cap_w, import_cap_w,
             has_battery, battery_kwh, has_ev.
      title: UpdateSiteRequest
      required:
        - site
        - updateMask
      additionalProperties: false
      description: |
        update_site.id // site.id is required
        update_site.mask // update_mask must name at least one of: pv_kw, inverter_kva, export_cap_w, import_cap_w, has_battery, battery_kwh, has_ev
    doelab.v1.UpdateSiteResponse:
      type: object
      properties:
        site:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Site'
          title: site
      title: UpdateSiteResponse
      additionalProperties: false
    doelab.v1.WatchFleetRequest:
      type: object
      properties:
        feederId:
          type: string
          title: feeder_id
          format: uuid
      title: WatchFleetRequest
      additionalProperties: false
    doelab.v1.WatchFleetResponse:
      type: object
      properties:
        summary:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.FleetSummary'
          title: summary
      title: WatchFleetResponse
      additionalProperties: false
    google.protobuf.FieldMask:
      type: string
      description: Comma-separated field paths in lowerCamelCase (for example, `user.displayName,photo`).
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
security: []
tags:
  - name: doelab.v1.AlertService
    description: |-
      AlertService shows the alerts of a feeder. Only the compliance service
       opens and resolves an alert, so there is no create, update or delete here:
       an operator can acknowledge one.
  - name: doelab.v1.AssistantService
    description: |-
      AssistantService answers a question about a feeder in plain words. A
       language model writes the answer; what it knows of the feeder it reads
       through four lookups, each of which the public API also serves. It changes
       nothing: there is no tool that writes, and a backstop stays a person's
       decision.

       The service is off unless the server was given a key for the model, and
       each answer costs money, so it is rationed: a few questions a minute for
       one address, a bound on the length of an answer, and a daily budget.
  - name: doelab.v1.BackstopService
    description: |-
      BackstopService is the emergency backstop: an operator overrides the
       envelopes of a feeder's sites with a fixed export limit, at once, until it
       is cleared. While a backstop is active the engine's envelopes for those
       sites are refused.
  - name: doelab.v1.ClockService
    description: |-
      ClockService tells every other process what time it is on the feeder.

       Feeder time is the clock of the simulation. At speed 1 it is wall-clock
       time. A demo runs faster: at speed 60 a day on the feeder passes in 24
       minutes. The API owns the clock; the engine, the simulated devices and the
       web app ask for it here, so they all agree.
  - name: doelab.v1.DeviceService
    description: DeviceService manages the DER behind each site.
  - name: doelab.v1.EnvelopeService
    description: |-
      EnvelopeService publishes operating envelopes and dispatches them to
       devices.

       An envelope is immutable. There is no update and no delete: publishing an
       envelope for an interval that already has one supersedes the old row, which
       is kept for audit.

       The demo carries CSIP-AUS / IEEE 2030.5 DERControl semantics over ConnectRPC
       streaming, in place of the 2030.5 REST and XML transport. export_limit_w is
       opModExpLimW and import_limit_w is opModImpLimW.
  - name: doelab.v1.EnvelopeConfigService
    description: |-
      EnvelopeConfigService manages the envelope policy of a feeder.

       A config is immutable. There is no update and no delete: a change is a new
       version, and the highest version is the active one.
  - name: doelab.v1.EnvelopeRunService
    description: |-
      EnvelopeRunService records the runs of the engine. The engine creates a run
       before it publishes, and completes it when it is done; everyone else reads.
  - name: doelab.v1.FeederService
    description: |-
      FeederService reads the network model, and lets an operator change the two
       things about it that are a matter of operation: the transformer tap and a
       line's rating. The model itself is created by the import.
  - name: doelab.v1.SiteService
    description: SiteService manages customer connection points and reads their profiles.
  - name: doelab.v1.SubstationService
    description: |-
      SubstationService reads the zone substations: where on the map the feeders
       are. A substation is created by the import, and nothing changes it.
  - name: doelab.v1.TelemetryService
    description: |-
      TelemetryService takes readings from devices, and shows what the fleet and
       the feeder are doing.
