    doelab.v1.ListDevicesResponse:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/doelab.v1.Device'
          title: devices
        nextPageToken:
          type: string
          title: next_page_token
      title: ListDevicesResponse
      additionalProperties: false
    doelab.v1.ListEnvelopeConfigsRequest:
      type: object
      properties:
        feederId:
          type: string
          title: feeder_id
          format: uuid
        pageSize:
          type: integer
          title: page_size
          maximum: 500
          minimum: 0
          format: int32
        pageToken:
          type: string
          title: page_token
          maxLength: 1024
      title: ListEnvelopeConfigsRequest
      additionalProperties: false
    doelab.v1.ListEnvelopeConfigsResponse:
      type: object
      properties:
        envelopeConfigs:
          type: array
          items:
            $ref: '#/components/schemas/doelab.v1.EnvelopeConfig'
          title: envelope_configs
        nextPageToken:
          type: string
          title: next_page_token
      title: ListEnvelopeConfigsResponse
      additionalProperties: false
    doelab.v1.ListFeederLinesRequest:
      type: object
      properties:
        feederId:
          type: string
          title: feeder_id
          format: uuid
        pageSize:
          type: integer
          title: page_size
          maximum: 500
          minimum: 0
          format: int32
        pageToken:
          type: string
          title: page_token
          maxLength: 1024
      title: ListFeederLinesRequest
      additionalProperties: false
    doelab.v1.ListFeederLinesResponse:
      type: object
      properties:
        feederLines:
          type: array
          items:
            $ref: '#/components/schemas/doelab.v1.FeederLine'
          title: feeder_lines
        nextPageToken:
          type: string
          title: next_page_token
      title: ListFeederLinesResponse
      additionalProperties: false
    doelab.v1.ListFeederNodesRequest:
      type: object
      properties:
        feederId:
          type: string
          title: feeder_id
          format: uuid
        pageSize:
          type: integer
          title: page_size
          maximum: 500
          minimum: 0
          format: int32
        pageToken:
          type: string
          title: page_token
          maxLength: 1024
      title: ListFeederNodesRequest
      additionalProperties: false
    doelab.v1.ListFeederNodesResponse:
      type: object
      properties:
        feederNodes:
          type: array
          items:
            $ref: '#/components/schemas/doelab.v1.FeederNode'
          title: feeder_nodes
        nextPageToken:
          type: string
          title: next_page_token
      title: ListFeederNodesResponse
      additionalProperties: false
    doelab.v1.ListFeedersRequest:
      type: object
      properties:
        pageSize:
          type: integer
          title: page_size
          maximum: 500
          minimum: 0
          format: int32
          description: At most this many feeders. 0 means the default, 100.
        pageToken:
          type: string
          title: page_token
          maxLength: 1024
          description: next_page_token of the previous page. Empty for the first page.
      title: ListFeedersRequest
      additionalProperties: false
    doelab.v1.ListFeedersResponse:
      type: object
      properties:
        feeders:
          type: array
          items:
            $ref: '#/components/schemas/doelab.v1.Feeder'
          title: feeders
        nextPageToken:
          type: string
          title: next_page_token
          description: Empty when there are no more pages.
      title: ListFeedersResponse
      additionalProperties: false
    doelab.v1.ListSiteProfilesRequest:
      type: object
      properties:
        siteId:
          type: string
          title: site_id
          format: uuid
        from:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: from
          description: Start of the range, inclusive.
        to:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: to
          description: End of the range, exclusive.
        pageSize:
          type: integer
          title: page_size
          maximum: 2000
          minimum: 0
          format: int32
        pageToken:
          type: string
          title: page_token
          maxLength: 1024
      title: ListSiteProfilesRequest
      required:
        - from
        - to
      additionalProperties: false
      description: |
        list_site_profiles.range // to must be after from
    doelab.v1.ListSiteProfilesResponse:
      type: object
      properties:
        siteProfiles:
          type: array
          items:
            $ref: '#/components/schemas/doelab.v1.SiteProfile'
          title: site_profiles
        nextPageToken:
          type: string
          title: next_page_token
      title: ListSiteProfilesResponse
      additionalProperties: false
    doelab.v1.ListSitesRequest:
      type: object
      properties:
        feederId:
          type: string
          title: feeder_id
          format: uuid
        phase:
          type:
            - integer
            - "null"
          title: phase
          maximum: 3
          minimum: 1
          format: int32
          description: Only sites on this phase.
        pageSize:
          type: integer
          title: page_size
          maximum: 500
          minimum: 0
          format: int32
        pageToken:
          type: string
          title: page_token
          maxLength: 1024
      title: ListSitesRequest
      additionalProperties: false
    doelab.v1.ListSitesResponse:
      type: object
      properties:
        sites:
          type: array
          items:
            $ref: '#/components/schemas/doelab.v1.Site'
          title: sites
        nextPageToken:
          type: string
          title: next_page_token
      title: ListSitesResponse
      additionalProperties: false
    doelab.v1.RunStatus:
      type: string
      title: RunStatus
      enum:
        - RUN_STATUS_UNSPECIFIED
        - RUN_STATUS_RUNNING
        - RUN_STATUS_COMPLETED
        - RUN_STATUS_FAILED
      description: The state of an engine run. Mirrors the run_status type.
    doelab.v1.Site:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        nmi:
          type: string
          title: nmi
          pattern: ^[A-Z0-9]{10}[0-9]$
          description: |-
            National Metering Identifier with its checksum digit: 11 characters. The
             checksum is verified by the service and by the schema.
        feederId:
          type: string
          title: feeder_id
          format: uuid
        nodeId:
          type: string
          title: node_id
          format: uuid
        name:
          type: string
          title: name
          maxLength: 200
          description: The connection's name in the source dataset.
        phase:
          type: integer
          title: phase
          maximum: 3
          minimum: 1
          format: int32
          description: 'The phase the site is connected to: 1, 2 or 3.'
        pvKw:
          type: number
          title: pv_kw
          minimum: 0
          format: double
          description: Installed PV capacity. 0 for a site with no PV.
        inverterKva:
          type: number
          title: inverter_kva
          minimum: 0
          format: double
        exportCapW:
          type: number
          title: export_cap_w
          minimum: 0
          format: double
          description: |-
            The largest export limit the site may be given. 0 means the site is
             passive: it gets no export envelope and is forecast instead.
        importCapW:
          type: number
          title: import_cap_w
          minimum: 0
          format: double
          description: |-
            The largest import limit the site may be given. 0 means no import
             envelope.
        hasBattery:
          type: boolean
          title: has_battery
        batteryKwh:
          exclusiveMinimum: 0
          type:
            - number
            - "null"
          title: battery_kwh
          format: double
          description: Set exactly when has_battery is true.
        hasEv:
          type: boolean
          title: has_ev
        profileCustomer:
          type:
            - integer
            - "null"
          title: profile_customer
          maximum: 300
          minimum: 1
          format: int32
          description: The Ausgrid Solar Home customer (1 to 300) whose data this site replays.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Site
      additionalProperties: false
      description: |
        A customer connection point: single phase, between one phase and the
         neutral of a bus. Mirrors the sites table. deleted_at is not on the wire: a
         deleted site is not returned.
        site.battery_sized // battery_kwh must be set exactly when has_battery is true
    doelab.v1.SiteProfile:
      type: object
      properties:
        siteId:
          type: string
          title: site_id
        ts:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ts
          description: Start of the half-hour interval, in the profile year.
        loadW:
          type: number
          title: load_w
          format: double
          description: Average general consumption over the interval.
        pvW:
          type: number
          title: pv_w
          format: double
          description: Average gross PV generation over the interval, before pv_scale.
        controlledLoadW:
          type: number
          title: controlled_load_w
          format: double
          description: Average controlled load (off-peak hot water) over the interval.
      title: SiteProfile
      additionalProperties: false
      description: One half-hour of a site's load and PV. Mirrors the site_profiles table.
    doelab.v1.UpdateDeviceRequest:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Device'
          title: device
        updateMask:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.FieldMask'
          title: update_mask
          description: 'Allowed path: rated_w.'
      title: UpdateDeviceRequest
      required:
        - device
        - updateMask
      additionalProperties: false
      description: |
        update_device.id // device.id is required
        update_device.mask // update_mask must be exactly: rated_w
        update_device.rated_w // rated_w must be positive
    doelab.v1.UpdateDeviceResponse:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Device'
          title: device
      title: UpdateDeviceResponse
      additionalProperties: false
    doelab.v1.UpdateFeederLineRequest:
      type: object
      properties:
        feederLine:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.FeederLine'
          title: feeder_line
        updateMask:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.FieldMask'
          title: update_mask
          description: 'Allowed path: ampacity_a.'
      title: UpdateFeederLineRequest
      required:
        - feederLine
        - updateMask
      additionalProperties: false
      description: |
        update_feeder_line.id // feeder_line.id is required
        update_feeder_line.mask // update_mask must be exactly: ampacity_a
    doelab.v1.UpdateFeederLineResponse:
      type: object
      properties:
        feederLine:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.FeederLine'
          title: feeder_line
      title: UpdateFeederLineResponse
      additionalProperties: false
    doelab.v1.UpdateFeederRequest:
      type: object
      properties:
        feeder:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Feeder'
          title: feeder
          description: feeder.id says which feeder; the fields named in update_mask are applied.
        updateMask:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.FieldMask'
          title: update_mask
          description: 'Allowed paths: name, tap_pu.'
      title: UpdateFeederRequest
      required:
        - feeder
        - updateMask
      additionalProperties: false
      description: |
        update_feeder.id // feeder.id is required
        update_feeder.mask // update_mask must name at least one of: name, tap_pu
        update_feeder.name // name must not be empty
        update_feeder.tap_pu // tap_pu must be between 0.85 and 1.15
    doelab.v1.UpdateFeederResponse:
      type: object
      properties:
        feeder:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Feeder'
          title: feeder
      title: UpdateFeederResponse
      additionalProperties: false
    doelab.v1.UpdateSiteRequest:
      type: object
      properties:
        site:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Site'
          title: site
        updateMask:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.FieldMask'
          title: update_mask
          description: |-
            Allowed paths: pv_kw, inverter_kva, export_cap_w, import_cap_w,
             has_battery, battery_kwh, has_ev.
      title: UpdateSiteRequest
      required:
        - site
        - updateMask
      additionalProperties: false
      description: |
        update_site.id // site.id is required
        update_site.mask // update_mask must name at least one of: pv_kw, inverter_kva, export_cap_w, import_cap_w, has_battery, battery_kwh, has_ev
    doelab.v1.UpdateSiteResponse:
      type: object
      properties:
        site:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Site'
          title: site
      title: UpdateSiteResponse
      additionalProperties: false
    google.protobuf.FieldMask:
      type: string
      description: Comma-separated field paths in lowerCamelCase (for example, `user.displayName,photo`).
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
security: []
tags:
  - name: doelab.v1.DeviceService
    description: DeviceService manages the DER behind each site.
  - name: doelab.v1.EnvelopeConfigService
    description: |-
      EnvelopeConfigService manages the envelope policy of a feeder.

       A config is immutable. There is no update and no delete: a change is a new
       version, and the highest version is the active one.
  - name: doelab.v1.FeederService
    description: |-
      FeederService reads the network model, and lets an operator change the two
       things about it that are a matter of operation: the transformer tap and a
       line's rating. The model itself is created by the import.
  - name: doelab.v1.SiteService
    description: SiteService manages customer connection points and reads their profiles.
