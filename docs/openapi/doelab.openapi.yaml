components:
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    doelab.v1.AcknowledgeAlertRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
      title: AcknowledgeAlertRequest
      additionalProperties: false
    doelab.v1.AcknowledgeAlertResponse:
      type: object
      properties:
        alert:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Alert'
          title: alert
      title: AcknowledgeAlertResponse
      additionalProperties: false
    doelab.v1.Alert:
      type: object
      properties:
        id:
          type: string
          title: id
        siteId:
          type: string
          title: site_id
        feederId:
          type: string
          title: feeder_id
          description: The feeder of the site.
        deviceId:
          type:
            - string
            - "null"
          title: device_id
          description: The device, for an offline alert.
        kind:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.AlertKind'
          title: kind
        severity:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.AlertSeverity'
          title: severity
        openedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: opened_at
          description: Feeder time the condition began.
        resolvedAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: resolved_at
          description: Feeder time the condition cleared. Unset while the alert is open.
        acknowledgedAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: acknowledged_at
        acknowledgedBy:
          type:
            - string
            - "null"
          title: acknowledged_by
        limitW:
          type:
            - number
            - "null"
          title: limit_w
          format: double
          description: 'For a breach: the export limit in force, in watts.'
        peakW:
          type:
            - number
            - "null"
          title: peak_w
          format: double
          description: 'For a breach: the largest net export seen while it lasted, in watts.'
        detail:
          type: string
          title: detail
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Alert
      additionalProperties: false
      description: A compliance or health alert on a site. Mirrors the alerts table.
    doelab.v1.AlertKind:
      type: string
      title: AlertKind
      enum:
        - ALERT_KIND_UNSPECIFIED
        - ALERT_KIND_CONSTRAINT_BREACH
        - ALERT_KIND_DEVICE_OFFLINE
      description: What an alert is about. Mirrors the alert_kind type.
    doelab.v1.AlertSeverity:
      type: string
      title: AlertSeverity
      enum:
        - ALERT_SEVERITY_UNSPECIFIED
        - ALERT_SEVERITY_INFO
        - ALERT_SEVERITY_WARNING
        - ALERT_SEVERITY_CRITICAL
      description: How serious an alert is. Mirrors the alert_severity type.
    doelab.v1.AmpacitySource:
      type: string
      title: AmpacitySource
      enum:
        - AMPACITY_SOURCE_UNSPECIFIED
        - AMPACITY_SOURCE_ASSUMED
        - AMPACITY_SOURCE_OPERATOR
      description: Where a line's current rating came from. Mirrors the ampacity_source type.
    doelab.v1.AnswerEnd:
      type: string
      title: AnswerEnd
      enum:
        - ANSWER_END_UNSPECIFIED
        - ANSWER_END_COMPLETE
        - ANSWER_END_CUT_SHORT
        - ANSWER_END_DECLINED
        - ANSWER_END_TOO_MANY_LOOKUPS
      description: How an answer ended.
    doelab.v1.AskRequest:
      type: object
      properties:
        feederCode:
          type: string
          title: feeder_code
          pattern: ^[A-Z0-9][A-Z0-9_-]{0,31}$
          description: The feeder the question is about.
        question:
          type: string
          title: question
          maxLength: 500
          minLength: 1
        nmi:
          type:
            - string
            - "null"
          title: nmi
          pattern: ^[A-Z0-9]{10}[0-9]$
          description: The site on the asker's screen, so that "this site" means something.
      title: AskRequest
      additionalProperties: false
    doelab.v1.AskResponse:
      type: object
      anyOf:
        - type: object
          properties:
            end:
              allOf:
                - $ref: '#/components/schemas/doelab.v1.AnswerEnd'
              title: end
          title: end
        - type: object
          properties:
            lookup:
              allOf:
                - $ref: '#/components/schemas/doelab.v1.AssistantLookup'
              title: lookup
              description: The assistant has looked something up.
          title: lookup
        - type: object
          properties:
            text:
              type: string
              title: text
              description: The next piece of the answer. The pieces, joined, are the answer.
          title: text
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - end
              - required:
                  - lookup
              - required:
                  - text
          - not:
              oneOf:
                - required:
                    - end
                - required:
                    - lookup
                - required:
                    - text
      title: AskResponse
      description: |-
        One step of an answer. A stream is zero or more lookups and pieces of
         text, in the order they happen, and then exactly one end.
    doelab.v1.AssistantLookup:
      type: object
      properties:
        tool:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.AssistantTool'
          title: tool
        subject:
          type: string
          title: subject
          description: 'What was looked up, in a few words: "XDLAB000014 at 12:30".'
        found:
          type: boolean
          title: found
          description: False when the lookup found nothing, or was asked for badly.
      title: AssistantLookup
      additionalProperties: false
    doelab.v1.AssistantTool:
      type: string
      title: AssistantTool
      enum:
        - ASSISTANT_TOOL_UNSPECIFIED
        - ASSISTANT_TOOL_GET_ENVELOPE
        - ASSISTANT_TOOL_GET_BINDING_CONSTRAINT
        - ASSISTANT_TOOL_LIST_BREACHES
        - ASSISTANT_TOOL_GET_CONFIG
      description: A lookup the assistant can make.
    doelab.v1.AssistantUnavailable:
      type: string
      title: AssistantUnavailable
      enum:
        - ASSISTANT_UNAVAILABLE_UNSPECIFIED
        - ASSISTANT_UNAVAILABLE_OFF
        - ASSISTANT_UNAVAILABLE_BUDGET_SPENT
      description: Why the assistant cannot be asked.
    doelab.v1.BackstopEvent:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        feederId:
          type: string
          title: feeder_id
          format: uuid
        reason:
          type: string
          title: reason
          maxLength: 500
          description: Why the operator triggered it.
        exportLimitW:
          type: number
          title: export_limit_w
          maximum: 1000000
          minimum: 0
          format: double
          description: |-
            The export limit imposed on every affected site, in watts. 0 stops
             export.
        triggeredBy:
          type: string
          title: triggered_by
          description: 'Set by the server: the scope that triggered it.'
        triggeredAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: triggered_at
          description: Feeder time the backstop took effect.
        clearedBy:
          type:
            - string
            - "null"
          title: cleared_by
        clearedAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: cleared_at
          description: Feeder time the backstop ended. Unset while it is active.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: BackstopEvent
      additionalProperties: false
      description: |-
        An emergency backstop, from trigger to clear. Mirrors the backstop_events
         table.
    doelab.v1.BindingConstraint:
      type: string
      title: BindingConstraint
      enum:
        - BINDING_CONSTRAINT_UNSPECIFIED
        - BINDING_CONSTRAINT_NONE
        - BINDING_CONSTRAINT_VOLTAGE_HIGH
        - BINDING_CONSTRAINT_VOLTAGE_LOW
        - BINDING_CONSTRAINT_TRANSFORMER
        - BINDING_CONSTRAINT_LINE
        - BINDING_CONSTRAINT_SITE_CAP
      description: |-
        What stops an envelope from being larger. Mirrors the binding_constraint
         type.
    doelab.v1.ClearBackstopRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
      title: ClearBackstopRequest
      additionalProperties: false
    doelab.v1.ClearBackstopResponse:
      type: object
      properties:
        backstopEvent:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.BackstopEvent'
          title: backstop_event
      title: ClearBackstopResponse
      additionalProperties: false
    doelab.v1.CompleteEnvelopeRunRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        status:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.RunStatus'
          title: status
          enum:
            - RUN_STATUS_COMPLETED
            - RUN_STATUS_FAILED
          description: COMPLETED or FAILED.
        durationMs:
          type: integer
          title: duration_ms
          minimum: 0
          format: int32
        siteCount:
          type: integer
          title: site_count
          minimum: 0
          format: int32
        intervalCount:
          type: integer
          title: interval_count
          minimum: 0
          format: int32
        error:
          type:
            - string
            - "null"
          title: error
          maxLength: 2000
          minLength: 1
          description: Required exactly when status is FAILED.
      title: CompleteEnvelopeRunRequest
      additionalProperties: false
      description: |
        complete_envelope_run.error // error must be set exactly when status is FAILED
    doelab.v1.CompleteEnvelopeRunResponse:
      type: object
      properties:
        envelopeRun:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.EnvelopeRun'
          title: envelope_run
      title: CompleteEnvelopeRunResponse
      additionalProperties: false
    doelab.v1.CreateBackstopEventRequest:
      type: object
      properties:
        backstopEvent:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.BackstopEvent'
          title: backstop_event
          description: 'Set by the client: feeder_id, reason, export_limit_w.'
        siteIds:
          type: array
          items:
            type: string
            format: uuid
          title: site_ids
          maxItems: 5000
          uniqueItems: true
          description: The sites to cover. Empty means every enrolled site of the feeder.
      title: CreateBackstopEventRequest
      required:
        - backstopEvent
      additionalProperties: false
      description: |
        create_backstop_event.required // feeder_id and reason are required
        create_backstop_event.server_set // id, triggered_by and cleared_by are set by the server
    doelab.v1.CreateBackstopEventResponse:
      type: object
      properties:
        backstopEvent:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.BackstopEvent'
          title: backstop_event
        siteIds:
          type: array
          items:
            type: string
          title: site_ids
      title: CreateBackstopEventResponse
      additionalProperties: false
    doelab.v1.CreateDeviceRequest:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Device'
          title: device
          description: id, created_at and updated_at are set by the server.
      title: CreateDeviceRequest
      required:
        - device
      additionalProperties: false
      description: |
        create_device.required // site_id, der_type and a positive rated_w are required
        create_device.server_set // id is set by the server
    doelab.v1.CreateDeviceResponse:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Device'
          title: device
      title: CreateDeviceResponse
      additionalProperties: false
    doelab.v1.CreateEnvelopeConfigRequest:
      type: object
      properties:
        envelopeConfig:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.EnvelopeConfig'
          title: envelope_config
          description: id, version, created_by and created_at are set by the server.
      title: CreateEnvelopeConfigRequest
      required:
        - envelopeConfig
      additionalProperties: false
      description: |
        create_envelope_config.required // feeder_id, policy, v_min_pu, v_max_pu, transformer_limit_pct, line_limit_pct, interval_minutes, horizon_intervals and offline_after_seconds are required
        create_envelope_config.server_set // id, version and created_by are set by the server
    doelab.v1.CreateEnvelopeConfigResponse:
      type: object
      properties:
        envelopeConfig:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.EnvelopeConfig'
          title: envelope_config
      title: CreateEnvelopeConfigResponse
      additionalProperties: false
    doelab.v1.CreateEnvelopeRunIntervalsRequest:
      type: object
      properties:
        envelopeRunId:
          type: string
          title: envelope_run_id
          format: uuid
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/doelab.v1.EnvelopeRunInterval'
          title: intervals
          maxItems: 288
          minItems: 1
      title: CreateEnvelopeRunIntervalsRequest
      additionalProperties: false
    doelab.v1.CreateEnvelopeRunIntervalsResponse:
      type: object
      properties:
        created:
          type: integer
          title: created
          format: int32
      title: CreateEnvelopeRunIntervalsResponse
      additionalProperties: false
    doelab.v1.CreateEnvelopeRunRequest:
      type: object
      properties:
        envelopeRun:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.EnvelopeRun'
          title: envelope_run
          description: |-
            Set by the client: feeder_id, envelope_config_id, idempotency_key,
             horizon_from, horizon_to, engine_version. The rest is the server's.
      title: CreateEnvelopeRunRequest
      required:
        - envelopeRun
      additionalProperties: false
      description: |
        create_envelope_run.horizon // horizon_to must be after horizon_from
        create_envelope_run.required // feeder_id, envelope_config_id, idempotency_key, horizon_from, horizon_to and engine_version are required
        create_envelope_run.server_set // id and status are set by the server
    doelab.v1.CreateEnvelopeRunResponse:
      type: object
      properties:
        envelopeRun:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.EnvelopeRun'
          title: envelope_run
      title: CreateEnvelopeRunResponse
      additionalProperties: false
    doelab.v1.CreateSiteRequest:
      type: object
      properties:
        site:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Site'
          title: site
          description: id, created_at and updated_at are set by the server.
      title: CreateSiteRequest
      required:
        - site
      additionalProperties: false
      description: |
        create_site.required // nmi, feeder_id, node_id, name and phase are required
        create_site.server_set // id is set by the server
    doelab.v1.CreateSiteResponse:
      type: object
      properties:
        site:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Site'
          title: site
      title: CreateSiteResponse
      additionalProperties: false
    doelab.v1.DeleteDeviceRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
      title: DeleteDeviceRequest
      additionalProperties: false
    doelab.v1.DeleteDeviceResponse:
      type: object
      title: DeleteDeviceResponse
      additionalProperties: false
    doelab.v1.DeleteSiteRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
      title: DeleteSiteRequest
      additionalProperties: false
    doelab.v1.DeleteSiteResponse:
      type: object
      title: DeleteSiteResponse
      additionalProperties: false
    doelab.v1.DerType:
      type: string
      title: DerType
      enum:
        - DER_TYPE_UNSPECIFIED
        - DER_TYPE_SOLAR
        - DER_TYPE_BATTERY
        - DER_TYPE_EV
      description: The kind of distributed energy resource. Mirrors the der_type type.
    doelab.v1.Device:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        siteId:
          type: string
          title: site_id
          format: uuid
        derType:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.DerType'
          title: der_type
          description: |
            enum.defined_only = true
        ratedW:
          type: number
          title: rated_w
          minimum: 0
          format: double
          description: Nameplate power.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Device
      additionalProperties: false
      description: |-
        A distributed energy resource behind a site: an inverter, a battery or an
         EV charger. Mirrors the devices table. deleted_at is not on the wire.
    doelab.v1.Envelope:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        siteId:
          type: string
          title: site_id
          format: uuid
        validFrom:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: valid_from
          description: Start of the interval, inclusive, in feeder time. On a 5-minute boundary.
        validTo:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: valid_to
          description: End of the interval, exclusive, in feeder time.
        opModExpLimW:
          type: number
          title: export_limit_w
          maximum: 1000000
          minimum: 0
          format: double
          description: |-
            Largest net export at the connection point, in watts.
             CSIP-AUS opModExpLimW.
        opModImpLimW:
          type: number
          title: import_limit_w
          maximum: 1000000
          minimum: 0
          format: double
          description: |-
            Largest net import at the connection point, in watts.
             CSIP-AUS opModImpLimW.
        source:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.EnvelopeSource'
          title: source
          description: |
            Set by the server: ENGINE for a published envelope, BACKSTOP for an
             operator's override.
            enum.defined_only = true
        envelopeRunId:
          type:
            - string
            - "null"
          title: envelope_run_id
          format: uuid
          description: The run that published the envelope. Set exactly when source is ENGINE.
        backstopEventId:
          type:
            - string
            - "null"
          title: backstop_event_id
          format: uuid
          description: |-
            The backstop that imposed the envelope. Set exactly when source is
             BACKSTOP.
        exportBinding:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.BindingConstraint'
          title: export_binding
          description: |
            What stops the export limit from being larger, and where.
            enum.defined_only = true
        exportBindingElement:
          type: string
          title: export_binding_element
          maxLength: 200
        importBinding:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.BindingConstraint'
          title: import_binding
          description: |
            What stops the import limit from being larger, and where.
            enum.defined_only = true
        importBindingElement:
          type: string
          title: import_binding_element
          maxLength: 200
        supersededAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: superseded_at
          description: |-
            Wall-clock time a newer envelope replaced this one. Unset while it is
             the active envelope.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: Envelope
      additionalProperties: false
      description: |
        The operating envelope of a site for one interval: the most it may export
         and import at its connection point. Mirrors the envelopes table.
        envelope.period // valid_to must be after valid_from
    doelab.v1.EnvelopeConfig:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        feederId:
          type: string
          title: feeder_id
          format: uuid
        version:
          type: integer
          title: version
          minimum: 0
          format: int32
          description: 'Set by the server: 1, 2, 3, ...'
        policy:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.EnvelopePolicy'
          title: policy
          description: |
            enum.defined_only = true
        vMinPu:
          type: number
          title: v_min_pu
          maximum: 1.2
          minimum: 0.8
          format: double
          description: Lower voltage limit at a customer, per unit of the nominal voltage.
        vMaxPu:
          type: number
          title: v_max_pu
          maximum: 1.2
          minimum: 0.8
          format: double
          description: Upper voltage limit at a customer, per unit of the nominal voltage.
        transformerLimitPct:
          exclusiveMinimum: 0
          type: number
          title: transformer_limit_pct
          maximum: 200
          format: double
          description: Allowed transformer loading, as a percentage of its rating.
        lineLimitPct:
          exclusiveMinimum: 0
          type: number
          title: line_limit_pct
          maximum: 200
          format: double
          description: Allowed conductor current, as a percentage of each line's ampacity.
        pvScale:
          type: number
          title: pv_scale
          maximum: 20
          minimum: 0
          format: double
          description: Multiplier on the 2010-2013 PV profiles, to represent present-day uptake.
        staticLimitW:
          type: number
          title: static_limit_w
          minimum: 0
          format: double
          description: The fixed export limit that reports compare the envelopes with.
        intervalMinutes:
          type: integer
          title: interval_minutes
          format: int32
          enum:
            - 5
            - 15
            - 30
            - 60
        horizonIntervals:
          type: integer
          title: horizon_intervals
          maximum: 288
          minimum: 1
          format: int32
        breachGraceSeconds:
          type: integer
          title: breach_grace_seconds
          maximum: 3600
          minimum: 0
          format: int32
          description: How long a site may exceed its export limit before a breach alert opens.
        offlineAfterSeconds:
          type: integer
          title: offline_after_seconds
          maximum: 86400
          minimum: 10
          format: int32
          description: How long a device may be silent before an offline alert opens.
        note:
          type: string
          title: note
          maxLength: 2000
        createdBy:
          type: string
          title: created_by
          description: 'Set by the server: the scope that created the version.'
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: EnvelopeConfig
      additionalProperties: false
      description: |
        The envelope policy of a feeder, as one immutable version. Mirrors the
         envelope_configs table.
        envelope_config.voltage_band // v_min_pu must be below v_max_pu
    doelab.v1.EnvelopePolicy:
      type: string
      title: EnvelopePolicy
      enum:
        - ENVELOPE_POLICY_UNSPECIFIED
        - ENVELOPE_POLICY_EQUAL
        - ENVELOPE_POLICY_PROPORTIONAL
      description: How capacity is shared between sites. Mirrors the envelope_policy type.
    doelab.v1.EnvelopeRun:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        feederId:
          type: string
          title: feeder_id
          format: uuid
        envelopeConfigId:
          type: string
          title: envelope_config_id
          format: uuid
          description: The config version the run used.
        status:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.RunStatus'
          title: status
          description: |
            enum.defined_only = true
        idempotencyKey:
          type: string
          title: idempotency_key
          pattern: ^[A-Za-z0-9._:-]{8,128}$
          description: 'Chosen by the engine: 8 to 128 characters of A-Z a-z 0-9 . _ : -'
        horizonFrom:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: horizon_from
          description: Start of the first interval of the run, in feeder time.
        horizonTo:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: horizon_to
          description: End of the last interval of the run, in feeder time.
        startedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: started_at
          description: Wall-clock time the run was created.
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: completed_at
          description: Wall-clock time the run finished. Unset while it is running.
        durationMs:
          type:
            - integer
            - "null"
          title: duration_ms
          minimum: 0
          format: int32
          description: How long the engine took. Unset while the run is running.
        siteCount:
          type: integer
          title: site_count
          minimum: 0
          format: int32
        intervalCount:
          type: integer
          title: interval_count
          minimum: 0
          format: int32
        envelopeCount:
          type: integer
          title: envelope_count
          minimum: 0
          format: int32
          description: Envelopes published by the run so far.
        engineVersion:
          type: string
          title: engine_version
          maxLength: 100
        error:
          type:
            - string
            - "null"
          title: error
          maxLength: 2000
          description: Why the run failed. Set exactly when status is FAILED.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: EnvelopeRun
      additionalProperties: false
      description: One run of the engine. Mirrors the envelope_runs table.
    doelab.v1.EnvelopeRunInterval:
      type: object
      properties:
        envelopeRunId:
          type: string
          title: envelope_run_id
          format: uuid
          description: Set by the server, from the request.
        feederId:
          type: string
          title: feeder_id
          format: uuid
          description: Set by the server, from the run.
        validFrom:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: valid_from
        validTo:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: valid_to
        forecastNetLoadW:
          type: number
          title: forecast_net_load_w
          format: double
          description: |-
            Forecast power through the transformer with every site at its forecast:
             positive is supply to the feeder, negative is reverse flow.
        forecastLoadingPct:
          type: number
          title: forecast_loading_pct
          minimum: 0
          format: double
          description: Forecast transformer loading, as a percentage of its rating.
        forecastVMinPu:
          exclusiveMinimum: 0
          type: number
          title: forecast_v_min_pu
          format: double
          description: Lowest and highest customer voltage with every site at its forecast.
        forecastVMaxPu:
          exclusiveMinimum: 0
          type: number
          title: forecast_v_max_pu
          format: double
        exportLimitTotalW:
          type: number
          title: export_limit_total_w
          minimum: 0
          format: double
          description: Sum of the limits the run gave for the interval.
        importLimitTotalW:
          type: number
          title: import_limit_total_w
          minimum: 0
          format: double
        staticLimitTotalW:
          type: number
          title: static_limit_total_w
          minimum: 0
          format: double
          description: |-
            What the enrolled sites could export under the config's fixed limit, the
             highest voltage that would cause, and the limit it would break.
        staticVMaxPu:
          exclusiveMinimum: 0
          type: number
          title: static_v_max_pu
          format: double
        staticBinding:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.BindingConstraint'
          not:
            enum:
              - BINDING_CONSTRAINT_UNSPECIFIED
          title: static_binding
          description: |
            enum.defined_only = true
        staticBindingElement:
          type: string
          title: static_binding_element
          maxLength: 200
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        envelopeVMaxPu:
          exclusiveMinimum: 0
          type:
            - number
            - "null"
          title: envelope_v_max_pu
          format: double
          description: |-
            Highest customer voltage if every enrolled site exported at its envelope:
             the engine's check on its own answer. Unset for a row from before the
             engine recorded it.
      title: EnvelopeRunInterval
      required:
        - validFrom
        - validTo
      additionalProperties: false
      description: |
        The forecast state of the whole feeder for one interval of a run. Mirrors
         the envelope_run_intervals table.
        envelope_run_interval.period // valid_to must be after valid_from
        envelope_run_interval.voltage // forecast_v_min_pu must not be above forecast_v_max_pu
    doelab.v1.EnvelopeSource:
      type: string
      title: EnvelopeSource
      enum:
        - ENVELOPE_SOURCE_UNSPECIFIED
        - ENVELOPE_SOURCE_ENGINE
        - ENVELOPE_SOURCE_BACKSTOP
      description: What produced an envelope. Mirrors the envelope_source type.
    doelab.v1.ExportEnvelopeRunRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
      title: ExportEnvelopeRunRequest
      additionalProperties: false
    doelab.v1.ExportEnvelopeRunResponse:
      type: object
      properties:
        url:
          type: string
          title: url
          description: |-
            A presigned link to the CSV file. Anyone who has it can download the
             file until expires_at.
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
          description: Wall-clock time the link stops working.
        rows:
          type: integer
          title: rows
          format: int32
          description: 'Envelopes in the file: its lines, less the header.'
        objectKey:
          type: string
          title: object_key
          description: Where the file is in the object store.
      title: ExportEnvelopeRunResponse
      additionalProperties: false
    doelab.v1.Feeder:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        code:
          type: string
          title: code
          pattern: ^[A-Z0-9][A-Z0-9_-]{0,31}$
          description: Short stable identifier, for example LV10.
        name:
          type: string
          title: name
          maxLength: 200
        nominalVoltageV:
          type: number
          title: nominal_voltage_v
          minimum: 0
          format: double
          description: Phase-to-neutral nominal voltage. Per-unit limits are against this.
        transformerKva:
          type: number
          title: transformer_kva
          minimum: 0
          format: double
        sourceVoltageV:
          type: number
          title: source_voltage_v
          minimum: 0
          format: double
          description: |-
            Open-circuit phase-to-earth voltage at the low-voltage terminals at the
             nominal tap.
        sourceAngleDeg:
          exclusiveMaximum: 360
          exclusiveMinimum: -360
          type: number
          title: source_angle_deg
          format: double
          description: Angle of phase 1. Phases 2 and 3 lag by 120 and 240 degrees.
        sourceROhm:
          type: number
          title: source_r_ohm
          minimum: 0
          format: double
        sourceXOhm:
          type: number
          title: source_x_ohm
          minimum: 0
          format: double
        tapPu:
          type: number
          title: tap_pu
          maximum: 1.15
          minimum: 0.85
          format: double
          description: |-
            Transformer tap, as a multiplier of source_voltage_v. 0.975 is one 2.5 %
             step down.
        timezone:
          type: string
          title: timezone
          description: IANA zone the feeder is in. Times on the wire are UTC.
        attribution:
          type: string
          title: attribution
          description: Licence and attribution of the dataset the feeder came from.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
        substationId:
          type:
            - string
            - "null"
          title: substation_id
          format: uuid
          description: |-
            The zone substation the feeder hangs from. Unset for a feeder that has
             not been placed.
      title: Feeder
      additionalProperties: false
      description: |-
        A low-voltage feeder below one distribution transformer. Mirrors the
         feeders table.
    doelab.v1.FeederLine:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        feederId:
          type: string
          title: feeder_id
          format: uuid
        name:
          type: string
          title: name
        fromNodeId:
          type: string
          title: from_node_id
          format: uuid
        toNodeId:
          type: string
          title: to_node_id
          format: uuid
        linecode:
          type: string
          title: linecode
          description: Cable type, as the OpenDSS linecode name of the source dataset.
        lengthM:
          type: number
          title: length_m
          minimum: 0
          format: double
        isSwitch:
          type: boolean
          title: is_switch
        rOhm:
          type: array
          items:
            type: number
            format: double
          title: r_ohm
          maxItems: 16
          minItems: 0
          description: |-
            Series resistance with earth return: 4x4, row-major (16 values), ohms,
             for the whole length. Conductors are phases 1 to 3, then the neutral.
        xOhm:
          type: array
          items:
            type: number
            format: double
          title: x_ohm
          maxItems: 16
          minItems: 0
          description: Series reactance with earth return, as r_ohm.
        bS:
          type: array
          items:
            type: number
            format: double
          title: b_s
          maxItems: 16
          minItems: 0
          description: Shunt susceptance in siemens, as r_ohm. Half sits at each end.
        ampacityA:
          exclusiveMinimum: 0
          type:
            - number
            - "null"
          title: ampacity_a
          format: double
          description: |-
            Continuous current rating per conductor. Unset means unrated: the line
             is not checked against a thermal limit.
        ampacitySource:
          oneOf:
            - $ref: '#/components/schemas/doelab.v1.AmpacitySource'
            - type: "null"
          title: ampacity_source
          description: |
            enum.defined_only = true
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: FeederLine
      additionalProperties: false
      description: |-
        The four-conductor line, or closed switch, into a bus from its parent.
         Mirrors the feeder_lines table.
    doelab.v1.FeederLineState:
      type: object
      properties:
        feederId:
          type: string
          title: feeder_id
          format: uuid
          description: Set by the server, from the run.
        lineId:
          type: string
          title: line_id
          format: uuid
        validFrom:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: valid_from
        validTo:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: valid_to
        envelopeRunId:
          type: string
          title: envelope_run_id
          format: uuid
          description: Set by the server, from the request.
        forecastCurrentA:
          type: array
          items:
            type: number
            format: double
          title: forecast_current_a
          maxItems: 4
          minItems: 4
        envelopeCurrentA:
          type: array
          items:
            type: number
