              $ref: '#/components/schemas/doelab.v1.UpdateSiteRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/doelab.v1.UpdateSiteResponse'
components:
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    doelab.v1.AlertKind:
      type: string
      title: AlertKind
      enum:
        - ALERT_KIND_UNSPECIFIED
        - ALERT_KIND_CONSTRAINT_BREACH
        - ALERT_KIND_DEVICE_OFFLINE
      description: What an alert is about. Mirrors the alert_kind type.
    doelab.v1.AlertSeverity:
      type: string
      title: AlertSeverity
      enum:
        - ALERT_SEVERITY_UNSPECIFIED
        - ALERT_SEVERITY_INFO
        - ALERT_SEVERITY_WARNING
        - ALERT_SEVERITY_CRITICAL
      description: How serious an alert is. Mirrors the alert_severity type.
    doelab.v1.AmpacitySource:
      type: string
      title: AmpacitySource
      enum:
        - AMPACITY_SOURCE_UNSPECIFIED
        - AMPACITY_SOURCE_ASSUMED
        - AMPACITY_SOURCE_OPERATOR
      description: Where a line's current rating came from. Mirrors the ampacity_source type.
    doelab.v1.BindingConstraint:
      type: string
      title: BindingConstraint
      enum:
        - BINDING_CONSTRAINT_UNSPECIFIED
        - BINDING_CONSTRAINT_NONE
        - BINDING_CONSTRAINT_VOLTAGE_HIGH
        - BINDING_CONSTRAINT_VOLTAGE_LOW
        - BINDING_CONSTRAINT_TRANSFORMER
        - BINDING_CONSTRAINT_LINE
        - BINDING_CONSTRAINT_SITE_CAP
      description: |-
        What stops an envelope from being larger. Mirrors the binding_constraint
         type.
    doelab.v1.CreateDeviceRequest:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Device'
          title: device
          description: id, created_at and updated_at are set by the server.
      title: CreateDeviceRequest
      required:
        - device
      additionalProperties: false
      description: |
        create_device.required // site_id, der_type and a positive rated_w are required
        create_device.server_set // id is set by the server
    doelab.v1.CreateDeviceResponse:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Device'
          title: device
      title: CreateDeviceResponse
      additionalProperties: false
    doelab.v1.CreateEnvelopeConfigRequest:
      type: object
      properties:
        envelopeConfig:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.EnvelopeConfig'
          title: envelope_config
          description: id, version, created_by and created_at are set by the server.
      title: CreateEnvelopeConfigRequest
      required:
        - envelopeConfig
      additionalProperties: false
      description: |
        create_envelope_config.required // feeder_id, policy, v_min_pu, v_max_pu, transformer_limit_pct, line_limit_pct, interval_minutes, horizon_intervals and offline_after_seconds are required
        create_envelope_config.server_set // id, version and created_by are set by the server
    doelab.v1.CreateEnvelopeConfigResponse:
      type: object
      properties:
        envelopeConfig:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.EnvelopeConfig'
          title: envelope_config
      title: CreateEnvelopeConfigResponse
      additionalProperties: false
    doelab.v1.CreateSiteRequest:
      type: object
      properties:
        site:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Site'
          title: site
          description: id, created_at and updated_at are set by the server.
      title: CreateSiteRequest
      required:
        - site
      additionalProperties: false
      description: |
        create_site.required // nmi, feeder_id, node_id, name and phase are required
        create_site.server_set // id is set by the server
    doelab.v1.CreateSiteResponse:
      type: object
      properties:
        site:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Site'
          title: site
      title: CreateSiteResponse
      additionalProperties: false
    doelab.v1.DeleteDeviceRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
      title: DeleteDeviceRequest
      additionalProperties: false
    doelab.v1.DeleteDeviceResponse:
      type: object
      title: DeleteDeviceResponse
      additionalProperties: false
    doelab.v1.DeleteSiteRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
      title: DeleteSiteRequest
      additionalProperties: false
    doelab.v1.DeleteSiteResponse:
      type: object
      title: DeleteSiteResponse
      additionalProperties: false
    doelab.v1.DerType:
      type: string
      title: DerType
      enum:
        - DER_TYPE_UNSPECIFIED
        - DER_TYPE_SOLAR
        - DER_TYPE_BATTERY
        - DER_TYPE_EV
      description: The kind of distributed energy resource. Mirrors the der_type type.
    doelab.v1.Device:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        siteId:
          type: string
          title: site_id
          format: uuid
        derType:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.DerType'
          title: der_type
          description: |
            enum.defined_only = true
        ratedW:
          type: number
          title: rated_w
          minimum: 0
          format: double
          description: Nameplate power.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Device
      additionalProperties: false
      description: |-
        A distributed energy resource behind a site: an inverter, a battery or an
         EV charger. Mirrors the devices table. deleted_at is not on the wire.
    doelab.v1.EnvelopeConfig:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        feederId:
          type: string
          title: feeder_id
          format: uuid
        version:
          type: integer
          title: version
          minimum: 0
          format: int32
          description: 'Set by the server: 1, 2, 3, ...'
        policy:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.EnvelopePolicy'
          title: policy
          description: |
            enum.defined_only = true
        vMinPu:
          type: number
          title: v_min_pu
          maximum: 1.2
          minimum: 0.8
          format: double
          description: Lower voltage limit at a customer, per unit of the nominal voltage.
        vMaxPu:
          type: number
          title: v_max_pu
          maximum: 1.2
          minimum: 0.8
          format: double
          description: Upper voltage limit at a customer, per unit of the nominal voltage.
        transformerLimitPct:
          exclusiveMinimum: 0
          type: number
          title: transformer_limit_pct
          maximum: 200
          format: double
          description: Allowed transformer loading, as a percentage of its rating.
        lineLimitPct:
          exclusiveMinimum: 0
          type: number
          title: line_limit_pct
          maximum: 200
          format: double
          description: Allowed conductor current, as a percentage of each line's ampacity.
        pvScale:
          type: number
          title: pv_scale
          maximum: 20
          minimum: 0
          format: double
          description: Multiplier on the 2010-2013 PV profiles, to represent present-day uptake.
        staticLimitW:
          type: number
          title: static_limit_w
          minimum: 0
          format: double
          description: The fixed export limit that reports compare the envelopes with.
        intervalMinutes:
          type: integer
          title: interval_minutes
          format: int32
          enum:
            - 5
            - 15
            - 30
            - 60
        horizonIntervals:
          type: integer
          title: horizon_intervals
          maximum: 288
          minimum: 1
          format: int32
        breachGraceSeconds:
          type: integer
          title: breach_grace_seconds
          maximum: 3600
          minimum: 0
          format: int32
          description: How long a site may exceed its export limit before a breach alert opens.
        offlineAfterSeconds:
          type: integer
          title: offline_after_seconds
          maximum: 86400
          minimum: 10
          format: int32
          description: How long a device may be silent before an offline alert opens.
        note:
          type: string
          title: note
          maxLength: 2000
        createdBy:
          type: string
          title: created_by
          description: 'Set by the server: the scope that created the version.'
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: EnvelopeConfig
      additionalProperties: false
      description: |
        The envelope policy of a feeder, as one immutable version. Mirrors the
         envelope_configs table.
        envelope_config.voltage_band // v_min_pu must be below v_max_pu
    doelab.v1.EnvelopePolicy:
      type: string
      title: EnvelopePolicy
      enum:
        - ENVELOPE_POLICY_UNSPECIFIED
        - ENVELOPE_POLICY_EQUAL
        - ENVELOPE_POLICY_PROPORTIONAL
      description: How capacity is shared between sites. Mirrors the envelope_policy type.
    doelab.v1.EnvelopeSource:
      type: string
      title: EnvelopeSource
      enum:
        - ENVELOPE_SOURCE_UNSPECIFIED
        - ENVELOPE_SOURCE_ENGINE
        - ENVELOPE_SOURCE_BACKSTOP
      description: What produced an envelope. Mirrors the envelope_source type.
    doelab.v1.Feeder:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        code:
          type: string
          title: code
          pattern: ^[A-Z0-9][A-Z0-9_-]{0,31}$
          description: Short stable identifier, for example LV10.
        name:
          type: string
          title: name
          maxLength: 200
        nominalVoltageV:
          type: number
          title: nominal_voltage_v
          minimum: 0
          format: double
          description: Phase-to-neutral nominal voltage. Per-unit limits are against this.
        transformerKva:
          type: number
          title: transformer_kva
          minimum: 0
          format: double
        sourceVoltageV:
          type: number
          title: source_voltage_v
          minimum: 0
          format: double
          description: |-
            Open-circuit phase-to-earth voltage at the low-voltage terminals at the
             nominal tap.
        sourceAngleDeg:
          exclusiveMaximum: 360
          exclusiveMinimum: -360
          type: number
          title: source_angle_deg
          format: double
          description: Angle of phase 1. Phases 2 and 3 lag by 120 and 240 degrees.
        sourceROhm:
          type: number
          title: source_r_ohm
          minimum: 0
          format: double
        sourceXOhm:
          type: number
          title: source_x_ohm
          minimum: 0
          format: double
        tapPu:
          type: number
          title: tap_pu
          maximum: 1.15
          minimum: 0.85
          format: double
          description: |-
            Transformer tap, as a multiplier of source_voltage_v. 0.975 is one 2.5 %
             step down.
        timezone:
          type: string
          title: timezone
          description: IANA zone the feeder is in. Times on the wire are UTC.
        attribution:
          type: string
          title: attribution
          description: Licence and attribution of the dataset the feeder came from.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Feeder
      additionalProperties: false
      description: |-
        A low-voltage feeder below one distribution transformer. Mirrors the
         feeders table.
    doelab.v1.FeederLine:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        feederId:
          type: string
          title: feeder_id
          format: uuid
        name:
          type: string
          title: name
        fromNodeId:
          type: string
          title: from_node_id
          format: uuid
        toNodeId:
          type: string
          title: to_node_id
          format: uuid
        linecode:
          type: string
          title: linecode
          description: Cable type, as the OpenDSS linecode name of the source dataset.
        lengthM:
          type: number
          title: length_m
          minimum: 0
          format: double
        isSwitch:
          type: boolean
          title: is_switch
        rOhm:
          type: array
          items:
            type: number
            format: double
          title: r_ohm
          maxItems: 16
          minItems: 0
          description: |-
            Series resistance with earth return: 4x4, row-major (16 values), ohms,
             for the whole length. Conductors are phases 1 to 3, then the neutral.
        xOhm:
          type: array
          items:
            type: number
            format: double
          title: x_ohm
          maxItems: 16
          minItems: 0
          description: Series reactance with earth return, as r_ohm.
        bS:
          type: array
          items:
            type: number
            format: double
          title: b_s
          maxItems: 16
          minItems: 0
          description: Shunt susceptance in siemens, as r_ohm. Half sits at each end.
        ampacityA:
          exclusiveMinimum: 0
          type:
            - number
            - "null"
          title: ampacity_a
          format: double
          description: |-
            Continuous current rating per conductor. Unset means unrated: the line
             is not checked against a thermal limit.
        ampacitySource:
          oneOf:
            - $ref: '#/components/schemas/doelab.v1.AmpacitySource'
            - type: "null"
          title: ampacity_source
          description: |
            enum.defined_only = true
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: FeederLine
      additionalProperties: false
      description: |-
        The four-conductor line, or closed switch, into a bus from its parent.
         Mirrors the feeder_lines table.
    doelab.v1.FeederNode:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        feederId:
          type: string
          title: feeder_id
          format: uuid
        name:
          type: string
          title: name
        parentNodeId:
          type:
            - string
            - "null"
          title: parent_node_id
          format: uuid
          description: |-
            The bus towards the transformer. Unset for the root, the transformer's
             low-voltage bus.
        groundROhm:
          type:
            - number
            - "null"
          title: ground_r_ohm
          minimum: 0
          format: double
          description: Impedance from the neutral to earth, when the neutral is earthed here.
        groundXOhm:
          type:
            - number
            - "null"
          title: ground_x_ohm
          minimum: 0
          format: double
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: FeederNode
      additionalProperties: false
      description: A bus of the feeder tree. Mirrors the feeder_nodes table.
    doelab.v1.GetActiveEnvelopeConfigRequest:
      type: object
      properties:
        feederId:
          type: string
          title: feeder_id
          format: uuid
      title: GetActiveEnvelopeConfigRequest
      additionalProperties: false
    doelab.v1.GetActiveEnvelopeConfigResponse:
      type: object
      properties:
        envelopeConfig:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.EnvelopeConfig'
          title: envelope_config
      title: GetActiveEnvelopeConfigResponse
      additionalProperties: false
    doelab.v1.GetDeviceRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
      title: GetDeviceRequest
      additionalProperties: false
    doelab.v1.GetDeviceResponse:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Device'
          title: device
      title: GetDeviceResponse
      additionalProperties: false
    doelab.v1.GetEnvelopeConfigRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
      title: GetEnvelopeConfigRequest
      additionalProperties: false
    doelab.v1.GetEnvelopeConfigResponse:
      type: object
      properties:
        envelopeConfig:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.EnvelopeConfig'
          title: envelope_config
      title: GetEnvelopeConfigResponse
      additionalProperties: false
    doelab.v1.GetFeederLineRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
      title: GetFeederLineRequest
      additionalProperties: false
    doelab.v1.GetFeederLineResponse:
      type: object
      properties:
        feederLine:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.FeederLine'
          title: feeder_line
      title: GetFeederLineResponse
      additionalProperties: false
    doelab.v1.GetFeederNodeRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
      title: GetFeederNodeRequest
      additionalProperties: false
    doelab.v1.GetFeederNodeResponse:
      type: object
      properties:
        feederNode:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.FeederNode'
          title: feeder_node
      title: GetFeederNodeResponse
      additionalProperties: false
    doelab.v1.GetFeederRequest:
      type: object
      allOf:
        - oneOf:
            - required:
                - id
            - required:
                - code
      anyOf:
        - type: object
          properties:
            code:
              type: string
              title: code
              pattern: ^[A-Z0-9][A-Z0-9_-]{0,31}$
          title: code
        - type: object
          properties:
            id:
              type: string
              title: id
              format: uuid
          title: id
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - code
              - required:
                  - id
          - not:
              oneOf:
                - required:
                    - code
                - required:
                    - id
      title: GetFeederRequest
    doelab.v1.GetFeederResponse:
      type: object
      properties:
        feeder:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Feeder'
          title: feeder
      title: GetFeederResponse
      additionalProperties: false
    doelab.v1.GetSiteRequest:
      type: object
      allOf:
        - oneOf:
            - required:
                - id
            - required:
                - nmi
      anyOf:
        - type: object
          properties:
            id:
              type: string
              title: id
              format: uuid
          title: id
        - type: object
          properties:
            nmi:
              type: string
              title: nmi
              pattern: ^[A-Z0-9]{10}[0-9]$
          title: nmi
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - id
              - required:
                  - nmi
          - not:
              oneOf:
                - required:
                    - id
                - required:
                    - nmi
      title: GetSiteRequest
    doelab.v1.GetSiteResponse:
      type: object
      properties:
        site:
          allOf:
            - $ref: '#/components/schemas/doelab.v1.Site'
          title: site
      title: GetSiteResponse
      additionalProperties: false
    doelab.v1.ListDevicesRequest:
      type: object
      properties:
        siteId:
          type:
            - string
            - "null"
          title: site_id
          format: uuid
          description: Only devices of this site.
        derType:
          oneOf:
            - $ref: '#/components/schemas/doelab.v1.DerType'
            - type: "null"
          not:
            enum:
              - DER_TYPE_UNSPECIFIED
          title: der_type
          description: |
            Only devices of this type.
