<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="doe-lab: dynamic operating envelopes on a real Australian low-voltage feeder. A simulation, not a real network."
    />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <!-- Before the first paint: a visitor who chose a theme, or dismissed the
         intro panel, sees the page that way from the start. `data-scheme` is
         the theme in force, which the stylesheet reads: the choice, or else
         what the system asks for. The script is inline because it must run
         before anything is drawn; its hash is added to the CSP by
         svelte.config.js, which reads it from this file. -->
    <script>
      (function () {
        var root = document.documentElement;
        var t = null;
        try {
          t = localStorage.getItem("doelab.theme");
          if (localStorage.getItem("doelab.intro")) root.dataset.intro = "dismissed";
        } catch (e) {}
        if (t === "light" || t === "dark") root.dataset.theme = t;
        else t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        root.dataset.scheme = t;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
